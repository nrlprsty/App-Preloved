name: CI Android

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant permission untuk gradlew
        run: chmod +x gradlew

      - name: Build aplikasi
        run: ./gradlew assembleDebug

      - name: Jalankan Unit Test
        run: ./gradlew test